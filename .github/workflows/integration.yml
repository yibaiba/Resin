name: Integration

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-tests:
    name: Quick Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WebUI
        working-directory: ./webui
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Prepare patched sing-box
        run: ./scripts/prepare-sing-box.sh

      - name: Run Unit Tests
        run: go test -count=1 -timeout=60s ./...

      - name: Run Focused Race Tests
        run: >-
          go test -race -count=1 -timeout=60s
          ./internal/proxy ./internal/probe ./internal/topology ./internal/outbound ./cmd/resin

  protocol-matrix:
    name: UDP Matrix (${{ matrix.protocol }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protocol:
          - socks
          - shadowsocks
          - vmess
          - vless
          - trojan
          - hysteria
          - hysteria2
          - tuic
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build WebUI
        working-directory: ./webui
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Prepare patched sing-box
        run: ./scripts/prepare-sing-box.sh

      - name: Run Real Protocol Test
        run: >-
          go test -count=1 -timeout=60s
          -tags "integration with_quic with_wireguard with_grpc with_utls"
          ./cmd/resin
          -run "^TestRealSingboxUDPProtocolMatrix$/^${{ matrix.protocol }}$"

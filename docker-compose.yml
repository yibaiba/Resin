services:
  resin:
    image: docker.io/yibaiba/resin:latest
    container_name: resin
    restart: unless-stopped
    environment:
      RESIN_ADMIN_TOKEN: "${RESIN_ADMIN_TOKEN}"
      RESIN_PROXY_TOKEN: "${RESIN_PROXY_TOKEN}"
      RESIN_LISTEN_ADDRESS: 0.0.0.0
      RESIN_PORT: 2260
      RESIN_SOCKS5_UDP_IDLE_TIMEOUT: "${RESIN_SOCKS5_UDP_IDLE_TIMEOUT:-5m}"
    ports:
      - "2260:2260/tcp"
      - "2260:2260/udp"
    volumes:
      - ./data/cache:/var/cache/resin
      - ./data/state:/var/lib/resin
      - ./data/log:/var/log/resin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2260/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
